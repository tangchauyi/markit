<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mark it!</title>
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div id="app" class="app">

  <!-- ================= 展开态看板 ================= -->
  <div class="board">

    <!-- 顶栏：产品名（旁渐变✓小方块 design §K，双击弹提示框 F31）+ 日历 + 固定 + 收起 + 关闭（右区顺序 §X） -->
    <header class="topbar">
      <div class="brand-group" id="brandBtn" role="button" tabindex="0" aria-label="关于与检查更新">
        <img class="brand-mark" src="assets/icons/app-icon@2x.png" alt="" width="20" height="20" aria-hidden="true">
        <div class="app-name">Mark it!</div>
      </div>
      <div class="spacer"></div>
      <!-- 日历回顾入口（F15，design §L）：位于图钉左侧，右区顺序 日历→图钉→收起 -->
      <button id="calBtn" class="icon-btn cal-btn" aria-label="日历回顾" aria-expanded="false">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M5.25 1.5v2.25 M10.75 1.5v2.25 M2.75 4.5h10.5v8.25a1.5 1.5 0 0 1-1.5 1.5H4.25a1.5 1.5 0 0 1-1.5-1.5z M5.5 8.25h.01 M10.5 8.25h.01"/></svg>
        <span class="pin-tip" aria-hidden="true">回看日历记录</span>
      </button>
      <!-- 固定按钮：纯图钉图标（F11），hover 由 CSS tooltip 呈现文字说明 -->
      <button id="pinBtn" class="icon-btn pin-btn" aria-pressed="false">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4.375 1.5h7.25a.875.875 0 0 1 .875.875v.875a.875.875 0 0 1-.875.875h-7.25a.875.875 0 0 1-.875-.875v-.875a.875.875 0 0 1 .875-.875zM5.9 3.25h4.2l-1.3 5.95h-1.6zM7.55 9.2h.9L8 14.75z"/></svg>
        <span class="pin-tip" aria-hidden="true"><span class="tip-off">点击置顶看板</span><span class="tip-on">已置顶 · 点击取消</span></span>
      </button>
      <!-- 收起按钮（F20 v1.7）：移除原生 title，hover/focus 浮现 .pin-tip 自绘提示（§Z） -->
      <button id="collapseBtn" class="icon-btn collapse-btn" aria-label="收起为胶囊">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="pin-tip" aria-hidden="true">收起为胶囊</span>
      </button>
      <!-- 关闭按钮（F18 v1.7）：点击退出应用；tooltip 复用 .pin-tip（§X） -->
      <button id="closeBtn" class="icon-btn close-btn" aria-label="退出应用">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M4.5 4.5 11.5 11.5 M11.5 4.5 4.5 11.5"/></svg>
        <span class="pin-tip" aria-hidden="true">退出应用</span>
      </button>
    </header>

    <!-- 纵向四分区（滚动区域） -->
    <main class="sections">
      <div class="sections-scroll" id="sectionsScroll">

        <section class="zone" data-p="0">
          <div class="zone-head">
            <span class="zone-logo">P0</span>
            <span class="zone-title">重要且紧急</span>
            <span class="zone-count-wrap">
              <span class="zone-badge" data-count="0">0</span>
              <span class="zone-title-float" aria-hidden="true">重要且紧急</span>
            </span>
          </div>
          <div class="note-list" data-list="0"></div>
          <!-- F23 v1.8 底部常驻空白区（§AB）：36px 双击热区，hover 微文案仅 ≥1 条笔记分区显示 -->
          <div class="zone-foot"><span class="zone-foot-hint" aria-hidden="true">双击记一条</span></div>
        </section>

        <section class="zone" data-p="1">
          <div class="zone-head">
            <span class="zone-logo">P1</span>
            <span class="zone-title">重要但不紧急</span>
            <span class="zone-count-wrap">
              <span class="zone-badge" data-count="1">0</span>
              <span class="zone-title-float" aria-hidden="true">重要但不紧急</span>
            </span>
          </div>
          <div class="note-list" data-list="1"></div>
          <div class="zone-foot"><span class="zone-foot-hint" aria-hidden="true">双击记一条</span></div>
        </section>

        <section class="zone" data-p="2">
          <div class="zone-head">
            <span class="zone-logo">P2</span>
            <span class="zone-title">不重要但紧急</span>
            <span class="zone-count-wrap">
              <span class="zone-badge" data-count="2">0</span>
              <span class="zone-title-float" aria-hidden="true">不重要但紧急</span>
            </span>
          </div>
          <div class="note-list" data-list="2"></div>
          <div class="zone-foot"><span class="zone-foot-hint" aria-hidden="true">双击记一条</span></div>
        </section>

        <section class="zone" data-p="3">
          <div class="zone-head">
            <span class="zone-logo">P3</span>
            <span class="zone-title">不重要且不紧急</span>
            <span class="zone-count-wrap">
              <span class="zone-badge" data-count="3">0</span>
              <span class="zone-title-float" aria-hidden="true">不重要且不紧急</span>
            </span>
          </div>
          <div class="note-list" data-list="3"></div>
          <div class="zone-foot"><span class="zone-foot-hint" aria-hidden="true">双击记一条</span></div>
        </section>

      </div>
    </main>

    <!-- 底部：快速输入框（渐变描边 wrapper，design §K） -->
    <footer class="bottombar">
      <div class="grad-wrap">
        <input id="quickInput" class="quick-input" type="text"
               placeholder="记一条，回车保存" autocomplete="off" spellcheck="false">
      </div>
    </footer>
  </div>

  <!-- ================= 收起态迷你胶囊（点击展开） ================= -->
  <div class="capsule" id="capsule" title="拖动移动位置">
    <span class="capsule-dot" style="background: var(--p0)"></span>
    <span class="capsule-dot" style="background: var(--p1)"></span>
    <span class="capsule-dot" style="background: var(--p2)"></span>
    <span class="capsule-dot" style="background: var(--p3)"></span>
    <span class="capsule-badge" id="capsuleCount">0</span>
    <button id="expandBtn" class="icon-btn" title="展开">
      <svg viewBox="0 0 16 16" width="14" height="14"><path d="M4 10l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

</div>

<!-- 渐变 defs（空态马克笔划线引用；零尺寸渲染不占布局，深浅色各一套 token） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gradMarkLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FA5C8D"/><stop offset="1" stop-color="#FBAF5D"/>
    </linearGradient>
    <linearGradient id="gradMarkDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FB7AA5"/><stop offset="1" stop-color="#FCBB74"/>
    </linearGradient>
  </defs>
</svg>

<!-- 删除撤销 toast -->
<div id="toast" class="toast" role="status">
  <span>已删除 ·</span>
  <button id="undoBtn" class="undo-btn" type="button">撤销</button>
</div>

<script defer src="assets/js/app.js"></script>
</body>
</html>
